<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" lang="zh" width="1000" height="542" viewBox="0 0 1000 542"><title id="title">动态目标围捕研究框架</title><desc id="desc">从三艇首次合围的闭合状态，进入单目标围捕保持与接替，再将三艇组的保持和恢复能力用于双目标调配。底部为共享的跨模型验证。各项均为研究设计。</desc>
<defs><marker id="tip" viewBox="0 0 8 8" markerWidth="6.5" markerHeight="6.5" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#19577c"/></marker></defs><rect width="1000" height="542" fill="#fff"/><g font-family="Arial, 'Noto Sans CJK SC', 'PingFang SC', 'Microsoft YaHei', 'Droid Sans Fallback', sans-serif">
<text x="24" y="28" font-size="14" fill="#19577c"  font-weight="700" text-anchor="start" font-style="normal">第 1–2 章   任务与共同模型</text>
<text x="24" y="61" font-size="25" fill="#192e3c" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', SimSun, 'Droid Sans Fallback', serif" font-weight="700" text-anchor="start" font-style="normal">目标持续机动时，编队如何建立包围并维持对多个目标的围控？</text>
<text x="24" y="88" font-size="17" fill="#475e6c"  font-weight="400" text-anchor="start" font-style="normal">统一描述 WAM-V 运动与推进约束，定义合围、失围和恢复。</text>
<path d="M24 104 H976" fill="none" stroke="#192e3c" stroke-width="1" stroke-linejoin="round"/>
<text x="130" y="133" font-size="13.5" fill="#475e6c"  font-weight="700" text-anchor="middle" font-style="normal">第 3 章</text>
<text x="130" y="160" font-size="22" fill="#192e3c" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', SimSun, 'Droid Sans Fallback', serif" font-weight="700" text-anchor="middle" font-style="normal">构型形成</text>
<text x="130" y="184" font-size="15.4" fill="#475e6c"  font-weight="400" text-anchor="middle" font-style="normal">三艇对一目标</text>
<text x="494" y="133" font-size="13.5" fill="#475e6c"  font-weight="700" text-anchor="middle" font-style="normal">第 4 章</text>
<text x="494" y="160" font-size="22" fill="#192e3c" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', SimSun, 'Droid Sans Fallback', serif" font-weight="700" text-anchor="middle" font-style="normal">持续围捕</text>
<text x="494" y="184" font-size="15.4" fill="#475e6c"  font-weight="400" text-anchor="middle" font-style="normal">同一目标，允许成员接替</text>
<text x="862" y="133" font-size="13.5" fill="#475e6c"  font-weight="700" text-anchor="middle" font-style="normal">第 5 章</text>
<text x="862" y="160" font-size="22" fill="#192e3c" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', SimSun, 'Droid Sans Fallback', serif" font-weight="700" text-anchor="middle" font-style="normal">动态编组</text>
<text x="862" y="184" font-size="15.4" fill="#475e6c"  font-weight="400" text-anchor="middle" font-style="normal">两组三艇对两目标（拟）</text>
<rect x="24" y="204" width="214" height="66" fill="#eaf2f6" stroke="#19577c" stroke-width="1.55"/>
<text x="131.0" y="231" font-size="18.3" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">确定构型并协同就位</text>
<text x="131.0" y="254" font-size="16.1" fill="#192e3c"  font-weight="400" text-anchor="middle" font-style="normal">从分散初态达到首次闭合</text>
<rect x="389" y="204" width="210" height="66" fill="#eaf2f6" stroke="#19577c" stroke-width="1.55"/>
<text x="494.0" y="231" font-size="18.3" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">随目标机动调整队形</text>
<text x="494.0" y="254" font-size="16.1" fill="#192e3c"  font-weight="400" text-anchor="middle" font-style="normal">保持三艇有效围控</text>
<rect x="751" y="204" width="221" height="66" fill="#eaf2f6" stroke="#19577c" stroke-width="1.55"/>
<text x="861.5" y="231" font-size="18.3" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">选择成员及交接时机</text>
<text x="861.5" y="254" font-size="16.1" fill="#192e3c"  font-weight="400" text-anchor="middle" font-style="normal">平衡两个目标的围控需求</text>
<path d="M238 237 H384" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M599 237 H746" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="311" y="225" font-size="15.8" fill="#19577c"  font-weight="700" text-anchor="middle" font-style="normal">首次闭合状态</text>
<text x="674" y="225" font-size="15.8" fill="#19577c"  font-weight="700" text-anchor="middle" font-style="normal">保持与恢复能力</text>
<path d="M130 270 V297" fill="none" stroke="#748995" stroke-width="1.3" stroke-linejoin="round"/>
<text x="130" y="322" font-size="16.1" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">交给下一阶段</text>
<text x="130" y="347" font-size="15.3" fill="#475e6c"  font-weight="400" text-anchor="middle" font-style="normal">艇位、艏向与速度</text>
<path d="M431 270 V317" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M554 321 V274" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="390" y="299" font-size="14.2" fill="#19577c"  font-weight="400" text-anchor="middle" font-style="normal">退出或失围</text>
<text x="562" y="299" font-size="14.2" fill="#19577c"  font-weight="400" text-anchor="start" font-style="normal">维持或恢复</text>
<rect x="390" y="322" width="209" height="48" fill="#fff" stroke="#748995" stroke-width="1.3"/>
<text x="494.5" y="351" font-size="16.8" fill="#192e3c"  font-weight="400" text-anchor="middle" font-style="normal">组织局部接替或重建包围</text>
<path d="M861 270 V281 H800 V299" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<path d="M861 281 H920 V299" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="800" y="319" font-size="16" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">目标 A</text>
<text x="920" y="319" font-size="16" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">目标 B</text>
<path d="M800 326 V337 H919 V326" fill="none" stroke="#748995" stroke-width="1.2" stroke-linejoin="round"/>
<path d="M860 337 V346" fill="none" stroke="#748995" stroke-width="1.2" stroke-linejoin="round"/>
<text x="860" y="366" font-size="16.1" fill="#192e3c"  font-weight="700" text-anchor="middle" font-style="normal">同时有效围控时间占比</text>
<path d="M24 383 V397 H975 V383" fill="none" stroke="#748995" stroke-width="1.35" stroke-linejoin="round"/>
<path d="M498 397 V418" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="24" y="444" font-size="14.4" fill="#19577c"  font-weight="700" text-anchor="start" font-style="normal">第 6 章</text>
<text x="108" y="445" font-size="20" fill="#192e3c" font-family="Georgia, 'Noto Serif CJK SC', 'Songti SC', SimSun, 'Droid Sans Fallback', serif" font-weight="700" text-anchor="start" font-style="normal">综合仿真验证</text>
<text x="24" y="475" font-size="16.6" fill="#192e3c"  font-weight="400" text-anchor="start" font-style="normal">二维 WAM-V 三自由度模型批量评测</text>
<path d="M335 469 H411" fill="none" stroke="#19577c" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#tip)"/>
<text x="434" y="475" font-size="16.6" fill="#192e3c"  font-weight="400" text-anchor="start" font-style="normal">在 VRX WAM-V 中复核形成、失围与交接工况</text>
<path d="M24 498 H976" fill="none" stroke="#748995" stroke-width="1" stroke-linejoin="round"/>
<text x="24" y="525" font-size="14.4" fill="#19577c"  font-weight="700" text-anchor="start" font-style="normal">研究边界</text>
<text x="110" y="525" font-size="15.3" fill="#475e6c"  font-weight="400" text-anchor="start" font-style="normal">结论将归纳适用条件。追逃博弈与多智能体强化学习为候选方法。</text>
</g></svg>
